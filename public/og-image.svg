<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0C0C"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#646973"/>
      <stop offset="100%" stop-color="#bbccd7"/>
    </linearGradient>
    <!-- Purple glow blob top-right -->
    <radialGradient id="glow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#B600A8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0C0C0C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border frame -->
  <rect x="32" y="32" width="1136" height="566" rx="24" fill="none" stroke="#D7E2EA" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Name -->
  <text x="96" y="290" font-family="Georgia, serif" font-size="96" font-weight="700" fill="url(#textGrad)">Kaviyarasu P</text>

  <!-- Divider line -->
  <rect x="96" y="320" width="120" height="2" rx="1" fill="#B600A8" opacity="0.7"/>

  <!-- Role line -->
  <text x="96" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#D7E2EA" opacity="0.55" letter-spacing="4">DEVELOPER · DATA ANALYST · POWER BI DEVELOPER</text>

  <!-- Tagline -->
  <text x="96" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="300" fill="#D7E2EA" opacity="0.35" letter-spacing="2">AI &amp; Data Science · K.S.Rangasamy College of Technology</text>

  <!-- URL badge -->
  <rect x="96" y="530" width="340" height="44" rx="22" fill="#D7E2EA" fill-opacity="0.05" stroke="#D7E2EA" stroke-opacity="0.15" stroke-width="1"/>
  <text x="266" y="558" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#D7E2EA" opacity="0.5" text-anchor="middle" letter-spacing="1">kaviyarasup24.vercel.app</text>
</svg>
